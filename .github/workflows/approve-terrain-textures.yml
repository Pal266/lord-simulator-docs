name: Import approved terrain sources

on:
  push:
    branches:
      - feature/spec-014-terrain-textures-approved
    paths:
      - .github/workflows/approve-terrain-textures.yml

permissions:
  contents: write

jobs:
  import-textures:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install 'Pillow>=11,<13'
      - name: Retrieve and verify the exact 24 approved PBR maps
        run: python specs/specs-014/download-approved-terrain-textures.py
      - name: Commit approved originals with SHA-256 provenance
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add visuals/approved/terrain/southern-coast-range/
          git rm .github/workflows/approve-terrain-textures.yml
          git commit -m 'Import user-approved Poly Haven CC0 terrain originals and provenance'
          git push origin HEAD:feature/spec-014-terrain-textures-approved
